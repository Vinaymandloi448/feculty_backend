# Server Port (Render assigns dynamic port via PORT environment variable)
server.port=${PORT:8080}

spring.application.name=feculty-backend

# MongoDB Atlas / Local Configuration
# Local default for development; Render production uses MONGODB_URI environment variable
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/faculty_connect}
spring.data.mongodb.database=${MONGODB_DATABASE:faculty_connect}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/faculty_connect}
spring.mongodb.database=${MONGODB_DATABASE:faculty_connect}

# JWT Configuration
# In production, set JWT_SECRET via Render environment variable (min 32 bytes / 256 bits)
jwt.secret=${JWT_SECRET:facultyconnect-dev-secret-key-change-in-production-minimum-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# CORS Configuration
# Comma-separated list of allowed frontend origins (supports Vercel production & local dev)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://fecultyconnectfrontend-z4lt.vercel.app,http://localhost:3000,http://localhost:5173}
