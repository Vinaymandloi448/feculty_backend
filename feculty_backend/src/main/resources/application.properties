spring.application.name=feculty-backend
spring.mongodb.uri=mongodb://localhost:27017/faculty_connect
spring.mongodb.database=faculty_connect

# --- JWT Configuration ---
# IMPORTANT: Override this secret in production via environment variable.
# Example: set JWT_SECRET=your-production-secret
# The secret must be at least 256 bits (32 bytes) for HS256 signing.
jwt.secret=${JWT_SECRET:facultyconnect-dev-secret-key-change-in-production-minimum-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- File Upload Configuration ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
